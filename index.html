<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEME TYCOON: ENTERPRISE EDITION</title>
    <style>
        :root {
            --bg-deep: #060608;
            --bg-surface: #111116;
            --bg-card: #191922;
            --cyan: #00f3ff;
            --cyan-glow: rgba(0, 243, 255, 0.3);
            --gold: #ffcc00;
            --gold-glow: rgba(255, 204, 0, 0.3);
            --pink: #ff00ff;
            --pink-glow: rgba(255, 0, 255, 0.3);
            --gem: #00ff88;
            --gem-glow: rgba(0, 255, 136, 0.3);
            --danger: #ff4444;
            --text-main: #ffffff;
            --text-muted: #8e8e9f;
            --border-radius-lg: 20px;
            --border-radius-md: 12px;
            --border-radius-sm: 6px;
            --transition-fast: 0.2s ease;
            --transition-normal: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body, html {
            margin: 0;
            padding: 0;
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            height: 100vh;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Scrollbar Optimization */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-deep);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--bg-card);
            border-radius: var(--border-radius-sm);
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--cyan);
        }

        /* Animations */
        @keyframes pulseGlow {
            0% { box-shadow: 0 0 10px var(--cyan-glow); }
            50% { box-shadow: 0 0 20px var(--cyan); }
            100% { box-shadow: 0 0 10px var(--cyan-glow); }
        }

        @keyframes floatEffect {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-5px); }
            100% { transform: translateY(0px); }
        }

        @keyframes flashSuccess {
            0% { background-color: rgba(0, 255, 136, 0.2); }
            100% { background-color: transparent; }
        }

        /* Layout */
        #app-container {
            display: grid;
            grid-template-rows: 90px 1fr 75px;
            height: 100vh;
            width: 100vw;
            box-sizing: border-box;
        }

        /* Authentication Screen */
        #auth-screen {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at center, #111118 0%, #050507 100%);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition-normal);
        }

        .auth-container {
            background: var(--bg-surface);
            border: 2px solid var(--cyan);
            border-radius: var(--border-radius-lg);
            padding: 40px;
            width: 360px;
            box-shadow: 0 0 30px var(--cyan-glow);
            text-align: center;
            animation: floatEffect 4s ease-in-out infinite;
        }

        .auth-logo {
            font-size: 2rem;
            font-weight: 900;
            letter-spacing: 2px;
            background: linear-gradient(45deg, var(--cyan), var(--pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 30px;
        }

        /* Form Elements */
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-label {
            display: block;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .input-control {
            width: 100%;
            padding: 14px;
            background: var(--bg-deep);
            border: 1px solid #2d2d3d;
            border-radius: var(--border-radius-md);
            color: var(--text-main);
            font-size: 1rem;
            box-sizing: border-box;
            transition: var(--transition-fast);
        }

        .input-control:focus {
            outline: none;
            border-color: var(--cyan);
            box-shadow: 0 0 10px var(--cyan-glow);
        }

        /* Buttons Framework */
        .btn-ui {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: var(--border-radius-md);
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: var(--transition-fast);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-cyan { background: var(--cyan); color: #000; }
        .btn-cyan:hover { background: #00c8ff; box-shadow: 0 0 15px var(--cyan); transform: translateY(-2px); }
        .btn-cyan:active { transform: translateY(0); }

        .btn-gold { background: var(--gold); color: #000; }
        .btn-gold:hover { background: #ffd633; box-shadow: 0 0 15px var(--gold); transform: translateY(-2px); }

        .btn-pink { background: var(--pink); color: #fff; }
        .btn-pink:hover { background: #ff33ff; box-shadow: 0 0 15px var(--pink); transform: translateY(-2px); }

        .btn-danger { background: var(--danger); color: #fff; }
        .btn-danger:hover { background: #ff2222; }

        .btn-disabled {
            background: #2d2d3d !important;
            color: var(--text-muted) !important;
            cursor: not-allowed !important;
            transform: none !important;
            box-shadow: none !important;
        }

        .logout-btn {
            background: transparent;
            border: 1px solid var(--danger);
            color: var(--danger);
            padding: 2px 8px;
            font-size: 0.7rem;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 4px;
            transition: var(--transition-fast);
        }
        .logout-btn:hover {
            background: var(--danger);
            color: #fff;
        }

        /* Header & Core Game View HUD */
        header {
            height: 90px;
            background: linear-gradient(180deg, #000000 0%, var(--bg-surface) 100%);
            border-bottom: 2px solid var(--cyan);
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            align-items: center;
            padding: 0 20px;
            box-sizing: border-box;
            z-index: 1000;
        }

        .hud-stat-box {
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .hud-value-primary {
            font-size: 1.4rem;
            font-weight: 900;
            letter-spacing: 0.5px;
            text-shadow: 0 0 10px rgba(255,255,255,0.1);
        }

        .hud-value-secondary {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 2px;
            font-weight: bold;
        }

        .avatar-hub-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .main-avatar-element {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            border: 2px solid var(--cyan);
            background-color: var(--bg-deep);
            cursor: pointer;
            object-fit: cover;
            transition: var(--transition-normal);
            box-shadow: 0 0 10px var(--cyan-glow);
        }

        .main-avatar-element:hover {
            transform: scale(1.05) rotate(5deg);
            border-color: var(--pink);
            box-shadow: 0 0 15px var(--pink-glow);
        }

        /* Modals & Overlay Windows Architecture */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(5px);
            z-index: 5000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: var(--transition-fast);
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-body-wrapper {
            background: var(--bg-surface);
            border: 2px solid var(--pink);
            border-radius: var(--border-radius-lg);
            padding: 25px;
            width: 380px;
            box-shadow: 0 0 25px var(--pink-glow);
            box-sizing: border-box;
            transform: scale(0.9);
            transition: var(--transition-normal);
        }

        .modal-overlay.active .modal-body-wrapper {
            transform: scale(1);
        }

        .modal-title-text {
            margin-top: 0;
            font-size: 1.3rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 20px;
        }

        /* Grid View & Content Panels */
        main {
            height: calc(100vh - 165px);
            overflow-y: auto;
            padding: 20px;
            box-sizing: border-box;
            background: radial-gradient(circle at top center, #0f0f15 0%, var(--bg-deep) 100%);
        }

        .page-view-panel {
            display: none;
            animation: flashSuccess 0.4s ease-out;
        }

        .page-view-panel.active {
            display: block;
        }

        .game-items-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(155px, 1fr));
            gap: 15px;
        }

        /* Universal Cards Styling */
        .item-display-card {
            background: var(--bg-card);
            border: 1px solid #2a2a3a;
            border-radius: var(--border-radius-md);
            padding: 12px;
            text-align: center;
            position: relative;
            transition: var(--transition-normal);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .item-display-card:hover {
            transform: translateY(-4px);
            border-color: var(--cyan);
            box-shadow: 0 5px 15px rgba(0, 243, 255, 0.15);
        }

        .item-display-card img {
            width: 100%;
            height: 105px;
            border-radius: var(--border-radius-sm);
            object-fit: cover;
            margin-bottom: 8px;
            background-color: var(--bg-deep);
        }

        .card-title-main {
            font-weight: 700;
            font-size: 0.95rem;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-stat-info {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        /* Specific Cases & Pets Interface Variations */
        .case-management-block {
            background: linear-gradient(135deg, #1b122c 0%, var(--bg-surface) 100%);
            border: 1px dashed var(--pink);
            border-radius: var(--border-radius-lg);
            padding: 20px;
            margin-bottom: 20px;
            position: relative;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .army-badge-counter {
            position: absolute;
            top: -8px;
            right: -8px;
            background: linear-gradient(45deg, var(--pink), #b300b3);
            color: #fff;
            font-weight: 900;
            font-size: 0.75rem;
            padding: 4px 10px;
            border-radius: 20px;
            box-shadow: 0 0 10px var(--pink-glow);
            border: 1px solid rgba(255,255,255,0.2);
        }

        /* Realtime Trader Dropdown Elements */
        .select-custom-ui {
            width: 100%;
            padding: 12px;
            background: var(--bg-deep);
            color: white;
            border: 1px solid #3d3d52;
            border-radius: var(--border-radius-md);
            margin-bottom: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        /* Network Users styling */
        .network-user-bar {
            background: var(--bg-card);
            border: 1px solid #2d2d3d;
            border-radius: var(--border-radius-md);
            padding: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: var(--transition-fast);
        }
        .network-user-bar:hover {
            border-color: var(--cyan);
        }

        /* Footer Adaptive Navigation */
        footer {
            height: 75px;
            background: #000000;
            border-top: 2px solid var(--gold);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 0 10px;
            box-sizing: border-box;
        }

        .navigation-action-trigger {
            background: none;
            border: none;
            color: var(--text-muted);
            font-weight: 800;
            cursor: pointer;
            font-size: 0.8rem;
            letter-spacing: 1px;
            padding: 10px 15px;
            border-radius: var(--border-radius-sm);
            transition: var(--transition-fast);
            text-transform: uppercase;
        }

        .navigation-action-trigger.active {
            color: var(--gold);
            text-shadow: 0 0 10px var(--gold-glow);
            background-color: rgba(255, 204, 0, 0.05);
        }
    </style>
</head>
<body>

    <div id="auth-screen">
        <div class="auth-container">
            <div class="auth-logo">MEME TYCOON</div>
            <div class="form-group">
                <label class="form-label">Ідентифікатор трейдера</label>
                <input type="text" id="auth-username-field" class="input-control" placeholder="Введіть нікнейм..." autocomplete="off">
            </div>
            <button onclick="CoreGameEngine.authenticateSession()" class="btn-ui btn-cyan">Увійти в мережу</button>
        </div>
    </div>

    <div id="admin-modal" class="modal-overlay">
        <div class="modal-body-wrapper" style="border-color: var(--danger); box-shadow: 0 0 25px rgba(255,68,68,0.3);">
            <h3 class="modal-title-text" style="color: var(--danger)">🛡️ Режим Розробника</h3>
            <button class="btn-ui btn-cyan" onclick="CoreGameEngine.debugInjectResource('cash', 10000000)" style="margin-bottom: 10px;">+$10,000,000</button>
            <button class="btn-ui btn-gold" onclick="CoreGameEngine.debugInjectResource('gems', 5000)" style="margin-bottom: 20px;">+5,000 Гемів</button>
            <button class="btn-ui btn-danger" onclick="UiController.closeActiveModals()">Закрити консоль</button>
        </div>
    </div>

    <div id="trade-modal" class="modal-overlay">
        <div class="modal-body-wrapper">
            <h3 class="modal-title-text" style="color: var(--pink)">🤝 Оформити Трейд</h3>
            <div style="text-align: left; margin-bottom: 15px;">
                <label class="form-label">Цільовий контрагент: <span id="ui-trade-target-name" style="color: var(--cyan); font-weight: bold;"></span></label>
            </div>
            <div class="form-group">
                <label class="form-label">Актив для передачі</label>
                <select id="trade-asset-dropdown" class="select-custom-ui"></select>
            </div>
            <div class="form-group">
                <label class="form-label">Запитувана компенсація ($)</label>
                <input type="number" id="trade-compensation-input" class="input-control" min="0" placeholder="Вкажіть суму...">
            </div>
            <button onclick="TradeNetwork.dispatchTradeOffer()" class="btn-ui btn-pink" style="margin-bottom: 10px;">Надіслати пропозицію</button>
            <button class="btn-ui btn-cyan" onclick="UiController.closeActiveModals()" style="background: #333; color: #fff;">Скасувати</button>
        </div>
    </div>

    <div id="app-container" style="display: none;">
        <header>
            <div class="hud-stat-box" style="align-items: flex-start;">
                <div class="hud-value-primary" style="color: var(--gold);">💰 <span id="hud-cash-display">0</span></div>
                <div class="hud-value-secondary">Множник: x<span id="hud-multiplier-display">1.00</span></div>
            </div>
            <div class="avatar-hub-wrapper">
                <img id="hud-user-avatar" class="main-avatar-element" src="" onclick="CoreGameEngine.handleAvatarSecretTrigger()">
                <button class="logout-btn" onclick="CoreGameEngine.terminateSession()">Вийти</button>
            </div>
            <div class="hud-stat-box" style="align-items: flex-end;">
                <div class="hud-value-primary" style="color: var(--gem);">💎 <span id="hud-gems-display">0</span></div>
                <div class="hud-value-secondary" style="color: var(--pink); font-family: monospace;">СТОК: <span id="hud-timer-display">03:00</span></div>
            </div>
        </header>

        <main>
            <div id="view-market" class="page-view-panel active">
                <h3 style="margin-top:0; letter-spacing: 0.5px; text-transform: uppercase; font-size: 1.1rem;">📦 Актуальні Пропозиції Ринку</h3>
                <div class="game-items-grid" id="market-rendering-container"></div>
            </div>
            
            <div id="view-pets" class="page-view-panel">
                <h3 style="margin-top:0; text-transform: uppercase; font-size: 1.1rem; color: var(--pink);">📦 Матриця Контейнерів (Кейси)</h3>
                <div id="cases-rendering-container" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 15px;"></div>
                <hr style="border: 0; height: 1px; background: #222; margin: 25px 0;">
                <h3 style="text-transform: uppercase; font-size: 1.1rem; color: var(--gem); margin-bottom: 15px;">🐾 Поточний Склад Бойових Петів</h3>
                <div class="game-items-grid" id="pets-owned-container"></div>
            </div>

            <div id="view-network" class="page-view-panel">
                <h3 style="margin-top:0; text-transform: uppercase; font-size: 1.1rem; color: var(--cyan);">🌐 Глобальний Локальний Вузол Трейдерів</h3>
                <div id="network-users-container" style="display: flex; flex-direction: column; gap: 10px;"></div>
            </div>
        </main>

        <footer>
            <button class="navigation-action-trigger active" onclick="UiController.switchActiveTab('view-market', this)">Ринок мемів</button>
            <button class="navigation-action-trigger" onclick="UiController.switchActiveTab('view-pets', this)">Інкубатор петів</button>
            <button class="navigation-action-trigger" onclick="UiController.switchActiveTab('view-network', this)">Мережа</button>
        </footer>
    </div>

    DATABASE_KEY_PREFIX: 'MEME_TYCOON_STATE_V4_',
    STOCK_REFRESH_INTERVAL: 180, // Секунди (3 хвилини)
    SAVE_INTERVAL: 2000,

    "荒Арсеній荒": {

        gemsPerPeriod: 4, 
        asset: "https://api.dicebear.com/7.x/bottts/svg?seed=Ilya",

    },

        incomeMultiplier: 0.20,

        gemsPerPeriod: 20,

        description: "+50% надпотужний буст всього виробництва. Легендарний екземпляр.",
        soundbite: "Критично високий рівень потужності" 
    }
};

const CASE_REGISTRY = {
    common: { 
        id: "case_common", 
        name: "Звичайний ящик", 
        cost: 300000, 
        pool: ["荒Егор荒", "荒Арсеній荒", "荒Міша荒"],
        color: "var(--text-muted)"
    },
    mythic: { 
        id: "case_mythic", 
        name: "Міфічний ящик", 
        cost: 1000000, 
        pool: ["荒Илья荒", "荒Арсеній荒", "荒Артур荒"],
        color: "var(--cyan)"
    },
    legend: { 
        id: "case_legend", 
        name: "Легендарний ящик", 
        cost: 5000000, 
        pool: ["荒Арсеній荒", "荒Артур荒", "Потужнометр"],
        color: "var(--gold)"
    }
};

const MEME_GALLERY = [
    "https://i.postimg.cc/7Z6pX0S8/doge.jpg",
    "https://i.postimg.cc/KjL9tH1Z/pepe.jpg",
    "https://i.postimg.cc/fyL8p6M7/gigachad.jpg",
    "https://i.postimg.cc/9f5Y1mPz/grumpy.jpg",
    "https://i.postimg.cc/T1S0G4Xy/stonks.jpg",
    "https://i.postimg.cc/vH4vD99B/harold.jpg"
];

const AVATAR_POOL = ["Doge", "Cyber", "Knight", "Robot", "Alien", "Wizard", "Ninja", "Zombie", "King", "Потужнометр"];

const GameStateManager = {
    _activeSessionUser: null,
    _state: null,

    initializeUserSession(username) {
        this._activeSessionUser = username;
        const storageKey = CONFIG.DATABASE_KEY_PREFIX + username;
        const rawData = localStorage.getItem(storageKey);

        if (rawData) {
            try {
                this._state = JSON.parse(rawData);
                this._sanitizeLoadedState();
            } catch (e) {
                console.error("Помилка завантаження стану. Створення нового профілю.", e);
                this._generateDefaultState(username);
            }
        } else {
            this._generateDefaultState(username);
        }
        this.persistStateToStorage();
    },

    _generateDefaultState(username) {
        this._state = {
            name: username,
            balance: 50000,
            gems: 100,
            inventory: {}, 
            pets: [],      
            avatar: "Doge",
            unlockedAvatars: ["Doge"],
            timestampCreated: Date.now()
        };
    },

    _sanitizeLoadedState() {
        if (!this._state.inventory || Array.isArray(this._state.inventory)) this._state.inventory = {};
        if (!this._state.pets || !Array.isArray(this._state.pets)) this._state.pets = [];
        if (typeof this._state.balance !== 'number' || isNaN(this._state.balance)) this._state.balance = 0;
        if (typeof this._state.gems !== 'number' || isNaN(this._state.gems)) this._state.gems = 0;
    },

    persistStateToStorage() {
        if (!this._activeSessionUser || !this._state) return;
        localStorage.setItem(CONFIG.DATABASE_KEY_PREFIX + this._activeSessionUser, JSON.stringify(this._state));
    },

    get traderName() { return this._state ? this._state.name : ''; },
    get cashBalance() { return this._state ? this._state.balance : 0; },
    get gemsBalance() { return this._state ? this._state.gems : 0; },
    get currentAvatar() { return this._state ? this._state.avatar : 'Doge'; },
    get ownedPets() { return this._state ? this._state.pets : []; },
    get memeInventory() { return this._state ? this._state.inventory : {}; },

    modifyCash(amount) {
        if (amount < 0 && this._state.balance + amount < 0) return false;
        this._state.balance += amount;
        return true;
    },

    modifyGems(amount) {
        if (amount < 0 && this._state.gems + amount < 0) return false;
        this._state.gems += amount;
        return true;
    },

    calculateGlobalMultiplier() {
        let multiplier = CONFIG.BASE_CLICK_MULTIPLIER;
        if (!this._state || !this._state.pets) return multiplier;
        this._state.pets.forEach(petName => {
            const petConfig = PET_REGISTRY[petName];
            if (petConfig) multiplier += petConfig.incomeMultiplier;
        });
        return multiplier;
    },

    calculateBaseGps() {
        let baseGps = 0;
        if (!this._state || !this._state.inventory) return baseGps;
        for (const [memeId, count] of Object.entries(this._state.inventory)) {
            const numericId = parseInt(memeId, 10);
            if (!isNaN(numericId)) baseGps += numericId * 5 * count;
        }
        return baseGps;
    },

    addPetToArmy(petName) {
        if (!PET_REGISTRY[petName]) return;
        this._state.pets.push(petName);
        this.persistStateToStorage();
    },

    addMemeToInventory(memeId) {
        this._state.inventory[memeId] = (this._state.inventory[memeId] || 0) + 1;
        this.persistStateToStorage();
    },

    destroySession() {
        this.persistStateToStorage();
        this._activeSessionUser = null;
        this._state = null;
    }
};

const MarketGenerator = {
    _currentActiveStock: [],
    _refreshCyclesCount: 0,

    generateNewStockSession() {
        this._currentActiveStock = [];
        this._refreshCyclesCount++;
        const activeLotIds = new Set();

        if (this._refreshCyclesCount % 5 === 0) {
            const guaranteedLotCount = Math.floor(Math.random() * 5) + 1;
            this._currentActiveStock.push({
                memeId: 50,
                availableCount: guaranteedLotCount,
                initialCount: guaranteedLotCount,
                basePrice: 50 * 450
            });
            activeLotIds.add(50);
        }

        while (this._currentActiveStock.length < 10) {
            const generatedId = Math.floor(Math.random() * 200) + 1;
            if (activeLotIds.has(generatedId)) continue;

            let allowedStockLimit = 0;
            if (generatedId <= 50) allowedStockLimit = Math.floor(Math.random() * 5) + 1;
            else if (generatedId <= 100) allowedStockLimit = Math.floor(Math.random() * 3) + 1;
            else if (generatedId <= 150) allowedStockLimit = Math.floor(Math.random() * 2) + 1;
            else allowedStockLimit = 1;

            this._currentActiveStock.push({
                memeId: generatedId,
                availableCount: allowedStockLimit,
                initialCount: allowedStockLimit,
                basePrice: generatedId * 450
            });
            activeLotIds.add(generatedId);
        }

        this._currentActiveStock.sort((a, b) => a.memeId - b.memeId);
        UiController.renderMarketInterface(this._currentActiveStock);
    },

    executeMemePurchase(memeId) {
        const targetLot = this._currentActiveStock.find(lot => lot.memeId === memeId);
        if (!targetLot) return "LOT_NOT_FOUND";
        if (targetLot.availableCount <= 0) return "OUT_OF_STOCK";
        if (GameStateManager.cashBalance < targetLot.basePrice) return "INSUFFICIENT_FUNDS";

        GameStateManager.modifyCash(-targetLot.basePrice);
        GameStateManager.addMemeToInventory(memeId);
        targetLot.availableCount--;

        return "SUCCESS";
    },

    get activeStock() { return this._currentActiveStock; }
};

const SoundEngine = {
    triggerVoiceLine(textToSpeak) {
        if (!textToSpeak || !('speechSynthesis' in window)) return;
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(textToSpeak);
        utterance.lang = 'uk-UA';
        utterance.pitch = 0.85;
        utterance.rate = 0.95;
        window.speechSynthesis.speak(utterance);
    }
};

const TradeNetwork = {
    _simulatedUsers: ["Ілля", "Міша", "Єгор", "Арсеній"],
    _activeTargetUser: null,

    renderNetworkNodes() {
        const container = document.getElementById('network-users-container');
        container.innerHTML = '';
        
        this._simulatedUsers.forEach(user => {
            if(user === GameStateManager.traderName) return;
            const element = document.createElement('div');
            element.className = 'network-user-bar';
            element.innerHTML = `
                <div>
                    <strong style="color: var(--cyan); font-size: 1.1rem;">${user}</strong>
                    <div style="font-size: 0.8rem; color: var(--text-muted);">Статус: В мережі (Локальний вузол)</div>
                </div>
                <button class="btn-ui btn-pink" style="width: auto; padding: 8px 16px; font-size: 0.85rem;" onclick="TradeNetwork.openTradeWindow('${user}')">Запропонувати обмін</button>
            `;
            container.appendChild(element);
        });
    },

    openTradeWindow(targetUser) {
        this._activeTargetUser = targetUser;
        document.getElementById('ui-trade-target-name').innerText = targetUser;
        
        const dropdown = document.getElementById('trade-asset-dropdown');
        dropdown.innerHTML = '';
        
        const inv = GameStateManager.memeInventory;
        let hasAssets = false;
        
        for (const [id, count] of Object.entries(inv)) {
            if (count > 0) {
                hasAssets = true;
                const option = document.createElement('option');
                option.value = id;
                option.innerText = `Мем #${id} (У вас є: ${count} шт)`;
                dropdown.appendChild(option);
            }
        }
        
        if(!hasAssets) {
            alert("Ваш інвентар порожній! Немає активів для обміну.");
            return;
        }
        
        UiController.openModal('trade-modal');
    },

    dispatchTradeOffer() {
        const assetId = document.getElementById('trade-asset-dropdown').value;
        const compensation = parseFloat(document.getElementById('trade-compensation-input').value) || 0;
        
        if(!assetId) return;
        
        // Перевірка наявності в інвентарі
        if((GameStateManager.memeInventory[assetId] || 0) <= 0) {
            alert("У вас немає цього мем-активу!");
            return;
        }
        
        UiController.closeActiveModals();
        
        alert(`Пропозицію надіслано трейдеру ${this._activeTargetUser}! Чекаємо підтвердження системи...`);
        
        setTimeout(() => {
            // Шанс успіху угоди залежить від вигідності пропозиції
            const isAccepted = Math.random() > 0.3;
            if(isAccepted) {
                GameStateManager.memeInventory[assetId]--;
                GameStateManager.modifyCash(compensation);
                alert(`🤝 Угода успішна! ${this._activeTargetUser} викупив Мем #${assetId} за $${compensation.toLocaleString()}`);
            } else {
                alert(`❌ ${this._activeTargetUser} відхилив вашу пропозицію обміну. Занадто висока ціна або неліквідний актив.`);
            }
            UiController.refreshHudDisplays();
        }, 2500);
    }
};

const UiController = {
    switchActiveTab(tabId, element) {
        document.querySelectorAll('.page-view-panel').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.navigation-action-trigger').forEach(b => b.classList.remove('active'));
        
        document.getElementById(tabId).classList.add('active');
        element.classList.add('active');
        
        if(tabId === 'view-network') {
            TradeNetwork.renderNetworkNodes();
        }
    },

    openModal(modalId) {
        document.getElementById(modalId).classList.add('active');
    },

    closeActiveModals() {
        document.querySelectorAll('.modal-overlay').forEach(m => m.classList.remove('active'));
    },

    refreshHudDisplays() {
        document.getElementById('hud-cash-display').innerText = Math.floor(GameStateManager.cashBalance).toLocaleString();
        document.getElementById('hud-gems-display').innerText = GameStateManager.gemsBalance;
        document.getElementById('hud-multiplier-display').innerText = GameStateManager.calculateGlobalMultiplier().toFixed(2);
        
        const avatarSeed = GameStateManager.currentAvatar;
        document.getElementById('hud-user-avatar').src = `https://api.dicebear.com/7.x/pixel-art/svg?seed=${avatarSeed}`;
        
        this.renderOwnedPetsGrid();
    },

    renderMarketInterface(stock) {
        const container = document.getElementById('market-rendering-container');
        container.innerHTML = '';
        
        stock.forEach(lot => {
            const card = document.createElement('div');
            card.className = 'item-display-card';
            
            const imgUrl = MEME_GALLERY[lot.memeId % MEME_GALLERY.length];
            
            card.innerHTML = `
                <div>
                    <img src="${imgUrl}" alt="Meme">
                    <div class="card-title-main">Мем Інвестування #${lot.memeId}</div>
                    <div class="card-stat-info">Дохід: +${lot.memeId * 5} $/сек</div>
                    <div style="font-size: 0.8rem; margin-bottom: 5px; color: ${lot.availableCount > 0 ? 'var(--cyan)' : 'var(--danger)'}">
                        Доступно: ${lot.availableCount} / ${lot.initialCount} шт.
                    </div>
                </div>
                <button class="btn-ui btn-cyan ${lot.availableCount <= 0 ? 'btn-disabled' : ''}" 
                        style="padding: 8px; font-size: 0.8rem;" 
                        onclick="CoreGameEngine.buyMemeAsset(${lot.memeId})"
                        ${lot.availableCount <= 0 ? 'disabled' : ''}>
                    Купити за $${lot.basePrice.toLocaleString()}
                </button>
            `;
            container.appendChild(card);
        });
    },

    renderCasesInterface() {
        const container = document.getElementById('cases-rendering-container');
        container.innerHTML = '';
        
        Object.entries(CASE_REGISTRY).forEach(([key, config]) => {
            const block = document.createElement('div');
            block.className = 'case-management-block';
            block.style.borderColor = config.color;
            
            block.innerHTML = `
                <h4 style="margin: 0 0 10px 0; color: ${config.color}; text-transform: uppercase;">${config.name}</h4>
                <div style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 15px;">
                    Можливий дроп: ${config.pool.join(', ')}
                </div>
                <button class="btn-ui btn-gold" style="padding: 10px; font-size: 0.85rem;" onclick="CoreGameEngine.openContainerBox('${key}')">
                    Відкрити за $${config.cost.toLocaleString()}
                </button>
            `;
            container.appendChild(block);
        });
    },

    renderOwnedPetsGrid() {
        const container = document.getElementById('pets-owned-container');
        container.innerHTML = '';
        
        const pets = GameStateManager.ownedPets;
        if(pets.length === 0) {
            container.innerHTML = '<div style="color: var(--text-muted); font-size: 0.9rem; grid-column: 1/-1; text-align: center; padding: 20px;">У вас ще немає бойових петів. Купуйте кейси!</div>';
            return;
        }
        
        // Розраховуємо кількість однакових петів
        const counts = {};
        pets.forEach(p => counts[p] = (counts[p] || 0) + 1);
        
        Object.entries(counts).forEach(([name, count]) => {
            const config = PET_REGISTRY[name];
            if(!config) return;
            
            const card = document.createElement('div');
            card.className = 'item-display-card';
            
            card.innerHTML = `
                <div style="position: relative;">
                    <div class="army-badge-counter">x${count}</div>
                    <img src="${config.asset}" alt="${name}" style="background: #2d2d3d; object-fit: contain; padding: 5px; box-sizing: border-box;">
                    <div class="card-title-main" style="color: var(--gem);">${name}</div>
                    <div class="card-stat-info" style="font-size: 0.7rem; line-height: 1.2;">${config.description}</div>
                </div>
                ${config.soundbite ? `
                    <button class="btn-ui btn-pink" style="padding: 5px; font-size: 0.75rem; margin-top: 5px;" onclick="SoundEngine.triggerVoiceLine('${config.soundbite}')">
                        🔊 Клич
                    </button>
                ` : ''}
            `;
            container.appendChild(card);
        });
    }
};

const CoreGameEngine = {
    _stockTimer: CONFIG.STOCK_REFRESH_INTERVAL,
    _avatarClicks: 0,

    startSystemLoops() {
        // Оновлення пасивного балансу раз на секунду
        setInterval(() => {
            if(!GameStateManager._state) return;
            
            // Розрахунок Cash від мемів
            const baseGps = GameStateManager.calculateBaseGps();
            const multiplier = GameStateManager.calculateGlobalMultiplier();
            const totalCashIncome = baseGps * multiplier;
            GameStateManager.modifyCash(totalCashIncome);
            
            // Розрахунок пасивних Gems від петів
            let totalGemsIncome = 0;
            GameStateManager.ownedPets.forEach(petName => {
                const petConfig = PET_REGISTRY[petName];
                if(petConfig && petConfig.gemsPerPeriod) {
                    totalGemsIncome += petConfig.gemsPerPeriod;
                }
            });
            GameStateManager.modifyGems(totalGemsIncome);
            
            // Оновлення таймера ринку
            this._stockTimer--;
            if(this._stockTimer <= 0) {
                MarketGenerator.generateNewStockSession();
                this._stockTimer = CONFIG.STOCK_REFRESH_INTERVAL;
            }
            
            this.updateTimerDisplay();
            UiController.refreshHudDisplays();
        }, 1000);

        // Автозбереження стану
        setInterval(() => {
            GameStateManager.persistStateToStorage();
        }, CONFIG.SAVE_INTERVAL);
    },

    updateTimerDisplay() {
        const minutes = Math.floor(this._stockTimer / 60);
        const seconds = this._stockTimer % 60;
        document.getElementById('hud-timer-display').innerText = 
            `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
    },

    authenticateSession() {
        const userField = document.getElementById('auth-username-field');
        const username = userField.value.trim();
        
        if(!username) {
            alert("Будь ласка, введіть дійсний нікнейм трейдера!");
            return;
        }
        
        GameStateManager.initializeUserSession(username);
        MarketGenerator.generateNewStockSession();
        UiController.renderCasesInterface();
        UiController.refreshHudDisplays();
        
        document.getElementById('auth-screen').style.display = 'none';
        document.getElementById('app-container').style.display = 'grid';
        
        this.startSystemLoops();
    },

    terminateSession() {
        GameStateManager.destroySession();
        window.location.reload();
    },

    buyMemeAsset(memeId) {
        const result = MarketGenerator.executeMemePurchase(memeId);
        if(result === "SUCCESS") {
            UiController.refreshHudDisplays();
            UiController.renderMarketInterface(MarketGenerator.activeStock);
        } else if(result === "INSUFFICIENT_FUNDS") {
            alert("❌ Недостатньо коштів на балансі!");
        } else if(result === "OUT_OF_STOCK") {
            alert("❌ Цей мем-актив повністю розпроданий у поточному періоді!");
        }
    },

    openContainerBox(caseKey) {
        const box = CASE_REGISTRY[caseKey];
        if(!box) return;
        
        if(GameStateManager.cashBalance < box.cost) {
            alert("❌ Недостатньо Cash для купівлі цього контейнера!");
            return;
        }
        
        GameStateManager.modifyCash(-box.cost);
        
        // Випадковий пет з пулу кейсу
        const randomIndex = Math.floor(Math.random() * box.pool.length);
        const rolledPetName = box.pool[randomIndex];
        
        GameStateManager.addPetToArmy(rolledPetName);
        UiController.refreshHudDisplays();
        
        alert(`🎉 Вітаємо! Ви вибили бойового пета: ${rolledPetName}`);
        
        const petConfig = PET_REGISTRY[rolledPetName];
        if(petConfig && petConfig.soundbite) {
            SoundEngine.triggerVoiceLine(petConfig.soundbite);
        }
    },

    handleAvatarSecretTrigger() {
        this._avatarClicks++;
        if(this._avatarClicks >= 7) {
            this._avatarClicks = 0;
            UiController.openModal('admin-modal');
        }
    },

    debugInjectResource(type, amount) {
        if(type === 'cash') GameStateManager.modifyCash(amount);
        if(type === 'gems') GameStateManager.modifyGems(amount);
        UiController.refreshHudDisplays();
    }
};
