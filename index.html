    <style>
        :root {
            --bg-deep: #060608;
            --bg-surface: #111116;
            --bg-card: #191922;
            --cyan: #00f3ff;
            --cyan-glow: rgba(0, 243, 255, 0.3);
            --gold: #ffcc00;
            --gold-glow: rgba(255, 204, 0, 0.3);
            --pink: #ff00ff;
            --pink-glow: rgba(255, 0, 255, 0.3);
            --gem: #00ff88;
            --gem-glow: rgba(0, 255, 136, 0.3);
            --danger: #ff4444;
            --text-main: #ffffff;
            --text-muted: #8e8e9f;
            --border-radius-lg: 20px;
            --border-radius-md: 12px;
            --border-radius-sm: 6px;
            --transition-fast: 0.2s ease;
            --transition-normal: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body, html {
            margin: 0;
            padding: 0;
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            height: 100vh;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Scrollbar Optimization */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-deep);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--bg-card);
            border-radius: var(--border-radius-sm);
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--cyan);
        }

        /* Animations */
        @keyframes pulseGlow {
            0% { box-shadow: 0 0 10px var(--cyan-glow); }
            50% { box-shadow: 0 0 20px var(--cyan); }
            100% { box-shadow: 0 0 10px var(--cyan-glow); }
        }

        @keyframes floatEffect {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-5px); }
            100% { transform: translateY(0px); }
        }

        @keyframes flashSuccess {
            0% { background-color: rgba(0, 255, 136, 0.2); }
            100% { background-color: transparent; }
        }

        /* Layout */
        #app-container {
            display: grid;
            grid-template-rows: 90px 1fr 75px;
            height: 100vh;
            width: 100vw;
            box-sizing: border-box;
        }

        /* Authentication Screen */
        #auth-screen {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at center, #111118 0%, #050507 100%);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition-normal);
        }

        .auth-container {
            background: var(--bg-surface);
            border: 2px solid var(--cyan);
            border-radius: var(--border-radius-lg);
            padding: 40px;
            width: 360px;
            box-shadow: 0 0 30px var(--cyan-glow);
            text-align: center;
            animation: floatEffect 4s ease-in-out infinite;
        }

        .auth-logo {
            font-size: 2rem;
            font-weight: 900;
            letter-spacing: 2px;
            background: linear-gradient(45deg, var(--cyan), var(--pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 30px;
        }

        /* Form Elements */
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-label {
            display: block;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .input-control {
            width: 100%;
            padding: 14px;
            background: var(--bg-deep);
            border: 1px solid #2d2d3d;
            border-radius: var(--border-radius-md);
            color: var(--text-main);
            font-size: 1rem;
            box-sizing: border-box;
            transition: var(--transition-fast);
        }

        .input-control:focus {
            outline: none;
            border-color: var(--cyan);
            box-shadow: 0 0 10px var(--cyan-glow);
        }

        /* Buttons Framework */
        .btn-ui {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: var(--border-radius-md);
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: var(--transition-fast);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-cyan { background: var(--cyan); color: #000; }
        .btn-cyan:hover { background: #00c8ff; box-shadow: 0 0 15px var(--cyan); transform: translateY(-2px); }
        .btn-cyan:active { transform: translateY(0); }

        .btn-gold { background: var(--gold); color: #000; }
        .btn-gold:hover { background: #ffd633; box-shadow: 0 0 15px var(--gold); transform: translateY(-2px); }

        .btn-pink { background: var(--pink); color: #fff; }

        .btn-danger { background: var(--danger); color: #fff; }
        .btn-danger:hover { background: #ff2222; }

        .btn-disabled {
            background: #2d2d3d !important;
            color: var(--text-muted) !important;
            cursor: not-allowed !important;
            transform: none !important;
            box-shadow: none !important;
        }
    </style>
</head>

    /**
 * Керує станом гри, валідацією транзакцій та персистентністю даних.
 * @namespace GameStateManager
 */
const GameStateManager = {
    _activeSessionUser: null,
    _state: null,

    /**
     * Ініціалізує нову сесію або завантажує наявну з локального сховища.
     * @param {string} username - Нікнейм користувача.
     */
    initializeUserSession(username) {
        this._activeSessionUser = username;
        const storageKey = CONFIG.DATABASE_KEY_PREFIX + username;
        const rawData = localStorage.getItem(storageKey);

        if (rawData) {
            try {
                this._state = JSON.parse(rawData);
                this._sanitizeLoadedState();
            } catch (e) {
                console.error("Критична помилка десеріалізації стану. Створення нового профілю.", e);
                this._generateDefaultState(username);
            }
        } else {
            this._generateDefaultState(username);
        }
        
        this.persistStateToStorage();
    },

    /**
     * Генерує дефолтну структуру даних для нового гравця.
     * @private
     */
    _generateDefaultState(username) {
        this._state = {
            name: username,
            balance: 50000,
            gems: 100,
            inventory: {}, // Формат: { memeId: count }
            pets: [],      // Масив рядків (імена петів, дозволені дублікати)
            avatar: "Doge",
            unlockedAvatars: ["Doge"],
            timestampCreated: Date.now()
        };
    },

    /**
     * Перевіряє структуру завантажених даних на збіг з поточною версією архітектури.
     * @private
     */
    _sanitizeLoadedState() {
        if (!this._state.inventory || Array.isArray(this._state.inventory)) this._state.inventory = {};
        if (!this._state.pets || !Array.isArray(this._state.pets)) this._state.pets = [];
        if (typeof this._state.balance !== 'number' || isNaN(this._state.balance)) this._state.balance = 0;
        if (typeof this._state.gems !== 'number' || isNaN(this._state.gems)) this._state.gems = 0;
    },

    /**
     * Синхронізує поточний стан з локальним сховищем.
     */
    persistStateToStorage() {
        if (!this._activeSessionUser || !this._state) return;
        localStorage.setItem(
            CONFIG.DATABASE_KEY_PREFIX + this._activeSessionUser, 
            JSON.stringify(this._state)
        );
    },

    // Геттери та Сеттери з вбудованою бізнес-логікою перевірок
    get traderName() { return this._state ? this._state.name : ''; },
    get cashBalance() { return this._state ? this._state.balance : 0; },
    get gemsBalance() { return this._state ? this._state.gems : 0; },
    get currentAvatar() { return this._state ? this._state.avatar : 'Doge'; },
    get ownedPets() { return this._state ? this._state.pets : []; },
    get memeInventory() { return this._state ? this._state.inventory : {}; },

    /**
     * Нараховує або знімає ігрову валюту (Cash).
     * @param {number} amount - Кількість (може бути від'ємною).
     * @returns {boolean} Успішність операції.
     */
    modifyCash(amount) {
        if (amount < 0 && this._state.balance + amount < 0) return false;
        this._state.balance += amount;
        return true;
    },

    /**
     * Нараховує або знімає преміум валюту (Gems).
     * @param {number} amount - Кількість.
     * @returns {boolean} Успішність операції.
     */
    modifyGems(amount) {
        if (amount < 0 && this._state.gems + amount < 0) return false;
        this._state.gems += amount;
        return true;
    },

    /**
     * Розраховує поточний загальний множник прибутку на основі армії петів.
     * @returns {number} Загальний мультиплікатор.
     */
    calculateGlobalMultiplier() {
        let multiplier = CONFIG.BASE_CLICK_MULTIPLIER;
        if (!this._state || !this._state.pets) return multiplier;
        
        this._state.pets.forEach(petName => {
            const petConfig = PET_REGISTRY[petName];
            if (petConfig) {
                multiplier += petConfig.incomeMultiplier;
            }
        });
        return multiplier;
    },

    /**
     * Розраховує базовий пасивний дохід від усіх мемів в інвентарі в секунду.
     * @returns {number} Дохід за секунду (Base GPS).
     */
    calculateBaseGps() {
        let baseGps = 0;
        if (!this._state || !this._state.inventory) return baseGps;

        for (const [memeId, count] of Object.entries(this._state.inventory)) {
            const numericId = parseInt(memeId, 10);
            if (!isNaN(numericId)) {
                // Кожен мем генерує дохід пропорційно своєму унікальному номеру
                baseGps += numericId * 5 * count;
            }
        }
        return baseGps;
    },

    /**
     * Додає купленого або вибитого з кейсу пета до армії.
     * @param {string} petName - Ім'я пета.
     */
    addPetToArmy(petName) {
        if (!PET_REGISTRY[petName]) return;
        this._state.pets.push(petName);
        this.persistStateToStorage();
    },

    /**
     * Додає одиницю мему до інвентаря гравця.
     * @param {number} memeId - Унікальний ідентифікатор мему.
     */
    addMemeToInventory(memeId) {
        this._state.inventory[memeId] = (this._state.inventory[memeId] || 0) + 1;
        this.persistStateToStorage();
    },

    /**
     * Очищує сесію та виконує логаут.
     */
    destroySession() {
        this.persistStateToStorage();
        this._activeSessionUser = null;
        this._state = null;
    }
};

 /**
 * Модуль генерації та контролю лімітів фондового сток-ринку мемів.
 * @namespace MarketGenerator
 */
const MarketGenerator = {
    _currentActiveStock: [],
    _refreshCyclesCount: 0,

    /**
     * Запускає повну процедуру регенерації ринкових лотів.
     * Реалізує суворі ліміти кількості та правила рідкості предметів.
     */
    generateNewStockSession() {
        this._currentActiveStock = [];
        this._refreshCyclesCount++;

        const activeLotIds = new Set();

        // Ексклюзивний алгоритм для лоту №50: гарантована поява кожні 5 циклів (15 хвилин)
        if (this._refreshCyclesCount % 5 === 0) {
            const guaranteedLotCount = Math.floor(Math.random() * 5) + 1; // Від 1 до 5 штук
            this._currentActiveStock.push({
                memeId: 50,
                availableCount: guaranteedLotCount,
                initialCount: guaranteedLotCount,
                basePrice: 50 * 450
            });
            activeLotIds.add(50);
        }

        // Заповнюємо вітрину магазину до 10 унікальних лотів
        while (this._currentActiveStock.length < 10) {
            const generatedId = Math.floor(Math.random() * 200) + 1;

            // Запобігаємо дублюванню однакових номерів мемів в одному заводі
            if (activeLotIds.has(generatedId)) continue;

            let allowedStockLimit = 0;

            // Диференціація лімітів кількості товарів відповідно до діапазонів ID
            if (generatedId <= 50) {
                allowedStockLimit = Math.floor(Math.random() * 5) + 1; // Часті: від 1 до 5
            } else if (generatedId <= 100) {
                allowedStockLimit = Math.floor(Math.random() * 3) + 1; // Незвичайні: від 1 до 3
            } else if (generatedId <= 150) {
                allowedStockLimit = Math.floor(Math.random() * 2) + 1; // Рідкісні: від 1 до 2
            } else {
                allowedStockLimit = 1; // Легендарні (ID 151-200): не більше 1 шт.
            }

            // Масштабування ціни: чим вищий ID, тим дорожчий і прибутковіший актив
            const computedPrice = generatedId * 450;

            this._currentActiveStock.push({
                memeId: generatedId,
                availableCount: allowedStockLimit,
                initialCount: allowedStockLimit,
                basePrice: computedPrice
            });

            activeLotIds.add(generatedId);
        }

        // Сортуємо лоти за зростанням ID для красивого візуального відображення в інтерфейсі
        this._currentActiveStock.sort((alpha, beta) => alpha.memeId - beta.memeId);
        
        // Викликаємо реактивне оновлення рендерингу інтерфейсу ринку
        UiController.renderMarketInterface(this._currentActiveStock);
    },

    /**
     * Обробити запит на покупку мем-активу з поточного стоку.
     * @param {number} memeId - Ідентифікатор мему, що купується.
     * @returns {string} Статус-код завершення транзакції.
     */
    executeMemePurchase(memeId) {
        const targetLot = this._currentActiveStock.find(lot => lot.memeId === memeId);

        if (!targetLot) return "LOT_NOT_FOUND";
        if (targetLot.availableCount <= 0) return "OUT_OF_STOCK";

        // Перевірка фінансової спроможності гравця через менеджер стану
        if (GameStateManager.cashBalance < targetLot.basePrice) return "INSUFFICIENT_FUNDS";

        // Проведення транзакції та списання балансу
        GameStateManager.modifyCash(-targetLot.basePrice);
        GameStateManager.addMemeToInventory(memeId);
        
        // Декрементуємо залишок товару в поточному стоці
        targetLot.availableCount--;

        // Повертаємо успішний статус для UI-тригерів
        return "SUCCESS";
    },

    /**
     * Повертає поточний масив лотів на ринку.
     * @returns {Array} Active Stock.
     */
    get activeStock() {
        return this._currentActiveStock;
    }
};

/**
 * Керує звуковими ефектами, синтезом мовлення та голосовими лініями петів.
 * @namespace SoundEngine
 */
const SoundEngine = {
    /**
     * Використовує Web Speech API для озвучування кастомних фраз унікальних петів.
     * @param {string} textToSpeak - Текст для вимови.
     */
    triggerVoiceLine(textToSpeak) {
        if (!textToSpeak || !('speechSynthesis' in window)) return;
        
        // Зупиняємо попереднє мовлення, щоб звуки не накладалися один на одного
        window.speechSynthesis.cancel();

        const utterance = new SpeechSynthesisUtterance(textToSpeak);
        utterance.lang = 'uk-UA';
        utterance.pitch = 0.85; // Трохи занижений пітч для солідності мем-звуку
        utterance.rate = 0.95;

        window.speechSynthesis.speak(utterance);
    }
};

/**
 * Головне керуюче ядро гри. Пов'язує всі компоненти в єдиний ігровий цикл.
 * @namespace CoreGameEngine
 */
const CoreGameEngine = {
    _stockTimerSeconds: CONFIG.STOCK_REFRESH_INTERVAL,
    _avatarSecretClicks: 0,
    _avatarSecretTimeout: null,

    /**
     * Вхідна точка авторизації сесії користувача.
     */
    authenticateSession() {
        const input = document.getElementById('auth-username-field');
        const username = input.value.trim();

        if (!username) {
            alert("Помилка! Ідентифікатор трейдера не може бути порожнім.");
            return;
        }

        GameStateManager.initializeUserSession(username);
        
        // Перемикаємо екрани
        document.getElementById('auth-screen').style.display = 'none';
        document.getElementById('app-container').style.display = 'grid';

        // Налаштовуємо аватар
        document.getElementById('hud-user-avatar').src = `https://api.dicebear.com/7.x/pixel-art/svg?seed=${GameStateManager.currentAvatar}`;

        // Генеруємо первинний сток товарів ринку
        MarketGenerator.generateNewStockSession();

        // Запускаємо головне серце ігрового всесвіту — Game Loop
        this.runCoreGameplayLoop();
    },

    /**
     * Головний тактовий генератор гри (1 тік = 1 секунда).
     */
    runCoreGameplayLoop() {
        setInterval(() => {
            if (!GameStateManager._state) return;

            const globalMultiplier = GameStateManager.calculateGlobalMultiplier();
            const baseGps = GameStateManager.calculateBaseGps();
            
            // Розрахунок підсумкового пасивного доходу секунди
            const finalIncomePerSecond = baseGps * globalMultiplier;
            GameStateManager.modifyCash(finalIncomePerSecond);

            // Пасивна генерація преміум гемів від петів (Шанс 10% кожну секунду)
            if (Math.random() < 0.10) {
                let totalGpsGems = 0;
                GameStateManager.ownedPets.forEach(petName => {
                    if (PET_REGISTRY[petName]) totalGpsGems += PET_REGISTRY[petName].gemsPerPeriod;
                });
                if (totalGpsGems > 0) GameStateManager.modifyGems(totalGpsGems);
            }

            // Робота з таймером оновлення фондового ринку
            this._stockTimerSeconds--;
            if (this._stockTimerSeconds <= 0) {
                this._stockTimerSeconds = CONFIG.STOCK_REFRESH_INTERVAL;
                MarketGenerator.generateNewStockSession();
            }

            // Форматування часу MM:SS
            const minutes = Math.floor(this._stockTimerSeconds / 60);
            const seconds = this._stockTimerSeconds % 60;
            const formattedTime = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;

            // Оновлюємо інтерфейс верхнього HUD
            UiController.updateHudLabels(
                GameStateManager.cashBalance,
                GameStateManager.gemsBalance,
                globalMultiplier,
                formattedTime
            );

        }, 1000);

        // Додатковий потік для автозбереження стану в бд раз на 2 секунди
        setInterval(() => {
            GameStateManager.persistStateToStorage();
        }, CONFIG.SAVE_INTERVAL);
    },

    /**
     * Обробити клік по кнопці покупки лоту мемів.
     */
    triggerMarketPurchase(memeId) {
        const result = MarketGenerator.executeMemePurchase(memeId);
        if (result === "SUCCESS") {
            UiController.renderMarketInterface(MarketGenerator.activeStock);
        } else if (result === "INSUFFICIENT_FUNDS") {
            alert("Помилка транзакції! У вас недостатньо грошей для придбання цього активу.");
        }
    },

    /**
     * Обробити запит на покупку та відкриття кейсу.
     */
    triggerCaseOpening(caseType) {
        const caseConfig = CASE_REGISTRY[caseType];
        if (!caseConfig) return;

        if (GameStateManager.cashBalance >= caseConfig.cost) {
            GameStateManager.modifyCash(-caseConfig.cost);
            
            // Рандомізація випадіння відповідно до пулу кейсу
            const randomPetResult = caseConfig.pool[Math.floor(Math.random() * caseConfig.pool.length)];
            GameStateManager.addPetToArmy(randomPetResult);

            alert(`🎉 ВІТАЄМО! З ящика випав пет: [ ${randomPetResult} ] ! Його бонуси додані до вашої армії.`);
            
            UiController.renderOwnedPetsInterface();
            this.playPetInteractionSound(randomPetResult);
        } else {
            alert("Недостатньо коштів на балансі для розпечатування даного контейнера!");
        }
    },

    /**
     * Відтворює кастомну звукову доріжку або voice-line пета.
     */
    playPetInteractionSound(petName) {
        const config = PET_REGISTRY[petName];
        if (config && config.soundbite) {
            SoundEngine.triggerVoiceLine(config.soundbite);
        }
    },

    /**
     * Секретний тригер виклику консолі розробника за 3 швидких тапи по аватару.
     */
    handleAvatarSecretTrigger() {
        this._avatarSecretClicks++;
        clearTimeout(this._avatarSecretTimeout);
        
        if (this._avatarSecretClicks >= 3) {
            UiController.openModalWindow('admin-modal');
            this._avatarSecretClicks = 0;
            return;
        }

        this._avatarSecretTimeout = setTimeout(() => {
            this._avatarSecretClicks = 0;
        }, 1500);
    },

    /**
     * Ін'єкція ресурсів через адмін-консоль розробника.
     */
    debugInjectResource(type, amount) {
        if (type === 'cash') GameStateManager.modifyCash(amount);
        if (type === 'gems') GameStateManager.modifyGems(amount);
    },

    /**
     * Термінувати поточну сесію та скинути додаток до екрану авторизації.
     */
    terminateSession() {
        if (confirm("Ви дійсно хочете вийти з вашого облікового запису в локальній мережі?")) {
            GameStateManager.destroySession();
            location.reload();
        }
    }
};
</script>
</body>
</html>
